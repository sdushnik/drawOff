version: "1"

services:
  - type: web
    name: drawoff
    runtime: docker
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh -c 'node dist/database/migrate.js && exec node dist/index.js'
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: drawoff-postgres
          property: connectionString
      - key: FRONTEND_ORIGINS
        fromService:
          name: drawoff
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PORT
        value: "10000"

databases:
  - name: drawoff-postgres
    plan: free
    databaseName: drawoff
    user: drawoff
    postgresMajorVersion: "18"
